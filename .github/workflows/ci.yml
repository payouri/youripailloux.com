name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Real content (content/) builds with NOINDEX on, so a bad real-content
      # commit fails here, not at deploy. Tests below stay fixture-only.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
